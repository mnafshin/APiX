name: Bug report
description: Report a defect in APiX behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For faster triage, attach a diagnostic bundle:
        `apix doctor bundle --file apix-diagnostic.zip`
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include exact commands, inputs, and sequence.
      placeholder: |
        1. Start engine with ...
        2. Run CLI command ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Version details
      description: Output of `apix status` and `apix version` if available.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic bundle
      description: Attach `apix-diagnostic.zip` generated by `apix doctor bundle`.
      placeholder: Drag-and-drop the zip here or link to it.
