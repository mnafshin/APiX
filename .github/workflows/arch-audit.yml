name: Arch audit & tests

on:
  push:
    branches: [ main ]
    paths:
      - 'internal/**'
      - '.github/**'
  pull_request:
    paths:
      - 'internal/**'
      - '.github/**'
  schedule:
    # weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  test:
    name: Run tests (includes arch test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run make test
        run: make test
        env:
          GOCACHE: ${{ runner.temp }}/go-cache

  audit:
    name: Full weekly audit (longer timeout)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run full test suite
        run: make test-coverage
        env:
          GOCACHE: ${{ runner.temp }}/go-cache

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
