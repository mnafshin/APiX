name: docs-sync

on:
  push:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'cmd/apix-cli/**'
      - 'cmd/apix-engine/**'
      - 'internal/config/**'
      - 'pkg/api/proto/**'
      - 'Makefile'
      - 'scripts/docs/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'cmd/apix-cli/**'
      - 'cmd/apix-engine/**'
      - 'internal/config/**'
      - 'pkg/api/proto/**'
      - 'Makefile'
      - 'scripts/docs/**'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Go tests
        run: make test
      - name: Verify docs contract snapshots
        run: scripts/docs/verify_contract_snapshots.sh
      - name: Run markdown link checker (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--root-dir . docs/**/*.md README.md'
          # pass --root-dir . so lychee can resolve root-relative links like /public/...
      - name: Lint markdown (markdownlint-cli)
        run: |
          # Install markdownlint CLI and run against docs and README
          npm install -g markdownlint-cli@0.33.0
          markdownlint "docs/**/*.md" README.md
