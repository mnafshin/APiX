name: Integration tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/integration/**'

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.16
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Run integration tests
        run: |
          go test ./tests/integration -v -run Test -count=1
