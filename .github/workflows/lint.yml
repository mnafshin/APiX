name: Lint

on:
  pull_request:
  push:
    paths:
      - '**/*.go'
      - '.golangci.yml'

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          version=v2.11.4
          curl -sSL "https://github.com/golangci/golangci-lint/releases/download/${version}/golangci-lint-2.11.4-linux-amd64.tar.gz" -o golangci-lint.tgz
          tar -xzf golangci-lint.tgz
          sudo mv golangci-lint-2.11.4-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m
