name: mcp-transcripts

on:
  pull_request:
    paths:
      - 'tests/mcp/**'
      - 'docs/testing_mcp_suite.md'

jobs:
  transcripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run MCP transcript tests
        run: go test ./tests/mcp -count=1 -v
