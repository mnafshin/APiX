name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Engine and CLI (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build engine and CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o apix-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/apix-engine/
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o apix-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/apix-cli/
          go build -o apix-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/apix-cli/
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apix-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            apix-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            apix-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  build-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          path: apix-vscode/bin/
          merge-multiple: true
      - name: Install & Package
        run: |
          cd apix-vscode
          npm ci
          npm run compile
          npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: apix-vscode/*.vsix

  smoke:
    name: Smoke built engine and CLI flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run release smoke
        run: make smoke

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-extension, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Verify release gate contract
        run: scripts/release/verify_release_gate.sh
      - name: Generate curated release notes
        run: scripts/release/generate_release_notes.sh "${{ github.ref_name }}" release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
