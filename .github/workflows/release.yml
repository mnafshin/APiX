name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-engine:
    name: Build Engine (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o apix-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/apix-engine/
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apix-engine-*

  build-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    needs: build-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          path: apix-vscode/bin/
          merge-multiple: true
      - name: Install & Package
        run: |
          cd apix-vscode
          npm ci
           npm run compile
          npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: apix-vscode/*.vsix

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-engine, build-extension]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
