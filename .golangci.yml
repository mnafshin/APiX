version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - ineffassign
    - unused
  settings:
    gosec:
      # disable G104 (CWE-78) for tests that intentionally use shelling
      excludes:
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - ineffassign
          - staticcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
