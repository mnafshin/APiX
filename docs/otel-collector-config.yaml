receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "apix"
          static_configs:
            - targets: ["host.docker.internal:9091"] # use localhost:9091 when Collector runs on host

exporters:
  otlp:
    endpoint: "your-otel-backend:4317"
    insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlp]
