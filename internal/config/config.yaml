http_port: "8080"
grpc_port: "9090"
grpc_bind_address: "127.0.0.1"  # default loopback-only; set to 0.0.0.0 for remote access (requires TLS + auth)
tls_enabled: false
# grpc_cert_path: "/etc/apix/grpc-server.pem"      # required when tls_enabled is true
# grpc_key_path: "/etc/apix/grpc-server-key.pem"   # required when tls_enabled is true
# auth_token: "replace-me"                         # prefer APIX_AUTH_TOKEN env var

mcp_enabled: false
mcp_port: "9093"
mcp_bind_address: "127.0.0.1"  # remote usage requires tls_enabled: true + auth token
mcp_allow_replay: false
mcp_allow_compose: false

# Logging
log_format: "text"  # text | json
log_level: "info"   # debug | info | warn | error
access_log_enabled: false
access_log_format: "json"  # json | common | combined
access_log_path: "stdout"  # stdout | stderr | /path/to/file.log
audit_log_enabled: false
audit_log_path: "stdout"   # stdout | stderr | /path/to/file.log

# OpenTelemetry tracing plugin
otel_enabled: false
otel_endpoint: "localhost:4317"
otel_service_name: "apix-proxy"
otel_insecure: true
otel_sample_rate: 1.0

# HTTP server timeouts (prevents Slowloris attacks)
http_read_header_timeout_sec: 10
http_read_timeout_sec: 30
http_write_timeout_sec: 120
http_idle_timeout_sec: 120
proxy_rate_limit_per_sec: 1000
proxy_max_concurrent_connections: 200

# Connection pool settings
max_idle_conns_per_host: 10  # max idle connections kept per upstream host
idle_conn_timeout_sec: 90    # seconds an idle connection stays open
dial_timeout_sec: 10         # seconds allowed for TCP dial to upstream

# Body size limits (prevents OOM from unbounded buffering)
max_body_size_mb: 32         # maximum request/response body size in MB (413 if exceeded)
max_headers_per_request: 200
max_header_value_bytes: 8192
max_total_header_bytes: 1048576
max_url_length: 8192

# History retention policy (0 = disabled / keep forever)
history_max_age_days: 0      # delete transactions older than N days
history_max_rows: 0          # keep at most N transactions (prunes oldest first)
# Map Local rules (optional): short-circuit upstream calls when URL matches.
