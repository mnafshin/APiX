http_port: "8080"
grpc_port: "9090"

# Connection pool settings
max_idle_conns_per_host: 10  # max idle connections kept per upstream host
idle_conn_timeout_sec: 90    # seconds an idle connection stays open
dial_timeout_sec: 10         # seconds allowed for TCP dial to upstream

# Body size limits (prevents OOM from unbounded buffering)
max_body_size_mb: 32         # maximum request/response body size in MB (413 if exceeded)