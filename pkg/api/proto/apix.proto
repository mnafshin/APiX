syntax = "proto3";

package apix;

option go_package = "github.com/mnafshin/apix/pkg/api/generated;generated";

// ========== Shared primitive messages ==========

message Empty {}

// HttpRequest represents a captured or synthesized HTTP request.
message HttpRequest {
  string method = 1;
  string url = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  int64 timestamp = 5;
  string id = 6; // UUID assigned at capture time
  string protocol = 7; // negotiated protocol: "HTTP/1.1", "HTTP/2.0", "h2c"
}

// HttpResponse represents a captured or synthesized HTTP response.
message HttpResponse {
  int32 status_code = 1;
  string status_text = 2;
  map<string, string> headers = 3;
  bytes body = 4;
}

message GraphQLRequestMetadata {
  string operation_name = 1;
  string query = 2;
  string variables_json = 3;
  bool is_batch = 4;
  int32 operation_count = 5;
}

message GraphQLError {
  string message = 1;
  string path_json = 2;
  string locations_json = 3;
  string extensions_json = 4;
  string raw_json = 5;
}

message GraphQLResponseMetadata {
  repeated GraphQLError errors = 1;
}

message GraphQLMetadata {
  GraphQLRequestMetadata request = 1;
  GraphQLResponseMetadata response = 2;
}

// HttpTransaction pairs a request with its response plus metadata.
message HttpTransaction {
  string id = 1;
  HttpRequest request = 2;
  HttpResponse response = 3;
  int64 timestamp = 4; // Unix ms
  int64 duration_ms = 5;
  GraphQLMetadata graphql = 6;
}

// ========== Plugin messages ==========

message PluginInfo {
  string name = 1;
  string version = 2;
  string description = 3;
  bool enabled = 4;
}

// ========== Status messages ==========

message StatusRequest {}

message StatusResponse {
  string status = 1;
  string version = 2;
  int32 proxy_port = 3;
  int32 grpc_port = 4;
  bool tls_enabled = 5;
}

// VersionRequest asks the engine for its API version information.
message VersionRequest {}

// VersionResponse carries the engine's version and the minimum client version
// it is compatible with. Clients should reject connections if their version is
// older than min_client_version.
message VersionResponse {
  string engine_version = 1; // semver of the running engine binary
  string api_version = 2; // semver of the gRPC API contract (from apix.proto)
  string min_client_version = 3; // oldest client version still compatible
}

// ========== Traffic capture messages ==========

message CaptureRequest {}

// ========== Plugin messages ==========

message PluginListRequest {}

message PluginListResponse {
  repeated PluginInfo plugins = 1;
}

// ========== Breakpoint messages ==========

// BreakpointRule defines a URL pattern to pause on.
message BreakpointRule {
  string id = 1; // UUID; empty on creation, server assigns
  string url_pattern = 2; // regex or glob pattern matched against full URL
  repeated string methods = 3; // empty = all methods
  bool enabled = 4;
  string label = 5; // human-readable label (optional)
  string header_name = 6; // optional request header name to match
  string header_value = 7; // optional value for header_name (empty = header existence)
  string body_pattern = 8; // optional regex matched against request/response body
  repeated int32 status_codes = 9; // optional response status codes (response-phase)
}

message BreakpointID {
  string id = 1;
}

message BreakpointList {
  repeated BreakpointRule breakpoints = 1;
}

// BreakpointResponse is returned after setting a breakpoint.
message BreakpointResponse {
  BreakpointRule breakpoint = 1;
}

// PausedRequest is streamed to the client when a request hits a breakpoint.
message PausedRequest {
  string request_id = 1;
  HttpRequest request = 2;
  string breakpoint_id = 3;
  int64 paused_at = 4; // Unix ms
}

// ResumeAction tells the engine what to do with a paused request.
message ResumeAction {
  string request_id = 1;
  HttpRequest modified_request = 2; // nil = forward original
  Action action = 3;

  enum Action {
    FORWARD = 0; // forward (optionally modified)
    DROP = 1; // drop the request, return 502
    RESPOND = 2; // return a synthetic response (modified_response must be set)
  }

  HttpResponse modified_response = 4; // only used when action = RESPOND
}

// ========== Replay messages ==========

// ReplaySpec describes what to replay and optional overrides.
message ReplaySpec {
  oneof source {
    string request_id = 1; // replay from history by ID
    HttpRequest raw_request = 2; // replay an arbitrary request
  }
  map<string, string> override_headers = 3;
  bytes override_body = 4;
  bool follow_redirects = 5;
}

// ComposeSpec executes an arbitrary request from scratch.
message ComposeSpec {
  HttpRequest request = 1;
  bool follow_redirects = 2;
}

// RequestTemplate stores a reusable composed request.
message RequestTemplate {
  string id = 1;
  string name = 2;
  HttpRequest request = 3;
  int64 updated_at = 4;
}

message RequestTemplateList {
  repeated RequestTemplate templates = 1;
}

message RequestTemplateID {
  string id = 1;
}

// ========== History messages ==========

message HistoryQuery {
  int32 limit = 1; // default 100
  int32 offset = 2;
  string url_filter = 3; // substring or regex
  string method_filter = 4; // e.g. "GET"
  int32 status_filter = 5; // e.g. 404; 0 = no filter
  int64 since_ms = 6; // only transactions after this Unix ms timestamp
  string body_filter = 7; // substring search in request OR response body
}

message GetWebSocketFramesRequest {
  string transaction_id = 1;
  int32 limit = 2;  // max frames to return; 0 = no limit
  int32 offset = 3; // number of frames to skip
}

message WebSocketFrame {
  string transaction_id = 1;
  string direction = 2; // "client" or "server"
  int32 opcode = 3; // 1=text, 2=binary, 8=close, 9=ping, 10=pong
  bytes payload = 4;
  int64 timestamp_ms = 5;
}

message ExportHARRequest {
  repeated string transaction_ids = 1; // empty = all stored traffic
}

message ExportHARResponse {
  string har_json = 1;
}

message ImportHARRequest {
  string har_json = 1;
}

message ImportHARResponse {
  repeated string transaction_ids = 1;
}

// ========== Rewrite rule messages ==========

message MatchCriteria {
  string url_pattern = 1;
  string method = 2;
  string header_name = 3;
  string header_value = 4;
  string body_pattern = 5;
  int32 status_code = 6;
}

enum RewriteAction {
  REWRITE_ACTION_UNSPECIFIED = 0;
  ADD_REQUEST_HEADER = 1;
  REMOVE_REQUEST_HEADER = 2;
  REPLACE_REQUEST_HEADER = 3;
  ADD_RESPONSE_HEADER = 4;
  REMOVE_RESPONSE_HEADER = 5;
  REPLACE_RESPONSE_HEADER = 6;
  REPLACE_REQUEST_BODY = 7;
  REPLACE_RESPONSE_BODY = 8;
  REDIRECT = 9;
  BLOCK = 10;
  RESPOND = 11;
}

message RewriteRule {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  int32 priority = 4;
  MatchCriteria match = 5;
  RewriteAction action = 6;
  string param_key = 7;
  string param_value = 8;
  bytes body_template = 9;
  int32 response_status = 10;
  bytes response_body = 11;
  string response_content_type = 12;
}

message RewriteRuleList {
  repeated RewriteRule rules = 1;
}

message RewriteRuleRequest {
  string rule_id = 1;
}

// ========== Service ==========

service Engine {
  // ----- Health -----
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  // GetVersion returns the engine's API version and compatibility contract.
  // Clients should call this on connect and compare api_version against their
  // own expectation. The min_client_version field indicates the oldest client
  // version still compatible with the running engine.
  rpc GetVersion(VersionRequest) returns (VersionResponse);

  // ----- Traffic capture -----
  // Stream all captured HTTP requests in real time.
  rpc CaptureTraffic(CaptureRequest) returns (stream HttpRequest);

  // ----- Plugins -----
  rpc ListPlugins(PluginListRequest) returns (PluginListResponse);

  // ----- Breakpoints -----
  // Register a URL pattern to pause on.
  rpc SetBreakpoint(BreakpointRule) returns (BreakpointResponse);
  // Remove a breakpoint by ID.
  rpc DeleteBreakpoint(BreakpointID) returns (Empty);
  // List all active breakpoints.
  rpc ListBreakpoints(Empty) returns (BreakpointList);
  // Server-streams newly paused requests to the client.
  rpc WatchPausedRequests(Empty) returns (stream PausedRequest);
  // Resume (or drop) a paused request, optionally with modifications.
  rpc ResumeRequest(ResumeAction) returns (Empty);

  // ----- Replay -----
  // Replay a stored or synthetic request and return the response.
  rpc ReplayRequest(ReplaySpec) returns (HttpResponse);
  // Execute a composed standalone request and return the response.
  rpc ComposeRequest(ComposeSpec) returns (HttpResponse);
  // Save (create/update by id) a reusable request template.
  rpc SaveRequestTemplate(RequestTemplate) returns (RequestTemplate);
  // List saved request templates.
  rpc ListRequestTemplates(Empty) returns (RequestTemplateList);
  // Delete a saved request template by id.
  rpc DeleteRequestTemplate(RequestTemplateID) returns (Empty);

  // ----- History -----
  // Retrieve stored request/response pairs from SQLite.
  rpc GetHistory(HistoryQuery) returns (stream HttpTransaction);
  // Retrieve stored WebSocket frames for a captured upgrade request.
  rpc GetWebSocketFrames(GetWebSocketFramesRequest) returns (stream WebSocketFrame);
  // Clear all stored history.
  rpc ClearHistory(Empty) returns (Empty);
  // Export stored traffic as HAR 1.2 JSON.
  rpc ExportHAR(ExportHARRequest) returns (ExportHARResponse);
  // Import HAR 1.2 JSON into stored history.
  rpc ImportHAR(ImportHARRequest) returns (ImportHARResponse);

  // ----- Rewrite rules -----
  rpc AddRewriteRule(RewriteRule) returns (RewriteRule);
  rpc UpdateRewriteRule(RewriteRule) returns (RewriteRule);
  rpc DeleteRewriteRule(RewriteRuleRequest) returns (Empty);
  rpc ListRewriteRules(Empty) returns (RewriteRuleList);
  rpc ToggleRewriteRule(RewriteRuleRequest) returns (RewriteRule);
}
